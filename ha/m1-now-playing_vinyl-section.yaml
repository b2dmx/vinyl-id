# Vinyl section for the existing "M-1 Now Playing" automation (Music label).
# DRAFT — merged into that automation once I can see how it sends art today;
# the brightness cap and bright-cover dimming stay exactly as they are.
#
# Rule: while a record is playing, the M-1 shows the record. When it stops,
# the automation's normal now-playing logic takes over again.

triggers:
  - trigger: state
    entity_id: sensor.vinyl_id_now_playing   # new song identified
    id: vinyl_track
  - trigger: state
    entity_id: binary_sensor.vinyl_id_record_playing
    to: "off"
    id: vinyl_stopped

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: vinyl_track
          - condition: state
            entity_id: binary_sensor.vinyl_id_record_playing
            state: "on"
          - condition: template
            value_template: "{{ state_attr('sensor.vinyl_id_now_playing', 'art_url') not in [none, ''] }}"
        sequence:
          # ← existing "send art to M-1" step goes here, fed with:
          #   {{ state_attr('sensor.vinyl_id_now_playing', 'art_url') }}
          - action: logbook.log
            data:
              name: M-1 Now Playing
              message: >-
                Vinyl: {{ state_attr('sensor.vinyl_id_now_playing', 'artist') }} –
                {{ states('sensor.vinyl_id_now_playing') }}

      - conditions:
          - condition: trigger
            id: vinyl_stopped
        sequence:
          # ← existing "show whatever is playing now / turn off" step goes here
          - action: logbook.log
            data:
              name: M-1 Now Playing
              message: Record stopped; back to normal now-playing

