# Vinyl section for the existing "STR-DH590 Music" automation (Music label).
# DRAFT — gets merged into that automation once I can see it; not a new automation.
# Paste-able in the UI editor (⋮ → Edit in YAML), then it stays editable visually.
#
# Placeholders to confirm at the rack:
#   media_player.YOUR_WIIM      → the WiiM plugged into the DH590
#   "Optical-in"                      → exact name in that WiiM's source list
#   script.YOUR_RECEIVER_POWER_TOGGLE           → your existing receiver power script
#   notify.mobile_app_YOUR_PHONE      → your phone
#
# Existing music branch (HomePods / Music Assistant → WiiM joins group):
#   add condition  binary_sensor.vinyl_id_record_playing is "off"
#   so Music Assistant music never takes the receiver while a record plays.

triggers:
  - trigger: state
    entity_id: binary_sensor.vinyl_id_record_playing
    to: "on"
    id: vinyl_started
  - trigger: state
    entity_id: media_player.YOUR_WIIM
    attribute: source
    from: Optical-in
    id: wiim_taken_over
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: VINYL_BACK
    id: vinyl_back_tapped
  - trigger: state
    entity_id: media_player.YOUR_WIIM
    to:
      - idle
      - paused
      - "off"
    for:
      seconds: 15
    id: wiim_stopped

conditions: []

actions:
  - choose:
      # Record starts → receiver on (only if off) → WiiM to the CAST's optical input
      - conditions:
          - condition: trigger
            id: vinyl_started
        sequence:
          - if:
              - condition: state
                entity_id: binary_sensor.YOUR_RECEIVER_POWER_INDICATOR
                state: "off"
            then:
              - action: script.YOUR_RECEIVER_POWER_TOGGLE
              - wait_for_trigger:
                  - trigger: state
                    entity_id: binary_sensor.YOUR_RECEIVER_POWER_INDICATOR
                    to: "on"
                timeout:
                  minutes: 1
          - action: media_player.select_source
            target:
              entity_id: media_player.YOUR_WIIM
            data:
              source: Optical-in

      # Phone AirPlays to the WiiM mid-record → ask once
      - conditions:
          - condition: trigger
            id: wiim_taken_over
          - condition: state
            entity_id: binary_sensor.vinyl_id_record_playing
            state: "on"
        sequence:
          - action: notify.mobile_app_YOUR_PHONE
            data:
              title: Record still playing
              message: Switch the receiver back to vinyl?
              data:
                tag: vinyl_takeover
                actions:
                  - action: VINYL_BACK
                    title: "Yes"
                  - action: VINYL_KEEP
                    title: "No"

      # "Yes" tapped, or the AirPlay ended while the record is still going → back to vinyl
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: vinyl_back_tapped
              - condition: and
                conditions:
                  - condition: trigger
                    id: wiim_stopped
                  - condition: not
                    conditions:
                      - condition: state
                        entity_id: media_player.YOUR_WIIM
                        attribute: source
                        state: Optical-in
          - condition: state
            entity_id: binary_sensor.vinyl_id_record_playing
            state: "on"
        sequence:
          - action: media_player.select_source
            target:
              entity_id: media_player.YOUR_WIIM
            data:
              source: Optical-in
          - action: notify.mobile_app_YOUR_PHONE
            data:
              message: clear_notification
              data:
                tag: vinyl_takeover

mode: queued
