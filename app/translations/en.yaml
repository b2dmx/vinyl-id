configuration:
  audio_source:
    name: Audio source
    description: >-
      How the record reaches Vinyl ID. Sendspin or AirPlay: Vinyl ID appears as a
      (silent) speaker in Music Assistant. Stream: read the address below directly.
  audio_input:
    name: Stream address
    description: Only used when the audio source is Stream.
  learn:
    name: Learn my records
    description: >-
      Save a fingerprint of each song so replays are identified on this device,
      without the internet. Off: always ask Shazam. Covers and your edits are saved either way.
  signal_threshold_db:
    name: Signal threshold (dB)
    description: >-
      How loud counts as playing. Set about 10 dB below a quiet record's level,
      shown by the Input Level sensor.
  receiver_name:
    name: Speaker name
    description: The name Vinyl ID uses in Music Assistant.
  edit_from:
    name: Also allow edits from
    description: >-
      Normally the library can only be changed from this page in Home Assistant.
      To let a script or another computer change it too, list their IP addresses here, separated by commas.
