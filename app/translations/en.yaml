configuration:
  audio_source:
    name: Audio source
    description: >-
      How the record reaches Vinyl ID. Sendspin (recommended) or AirPlay: a silent speaker,
      Vinyl ID Listener, appears in Music Assistant, and the Vinyl ID integration connects
      your record to it. Stream: Vinyl ID reads the address below and Music Assistant is not needed.
  audio_input:
    name: Stream address
    description: >-
      Only for the Stream audio source: the address of an audio stream that carries your turntable,
      for example http://192.168.1.50:8000/turntable.mp3.
  learn:
    name: Learn my records
    description: >-
      Save a fingerprint of each song so replays are identified on this device,
      without the internet. Off: always ask Shazam. Covers and your edits are saved either way.
  signal_threshold_db:
    name: Quiet level (signal threshold, dB)
    description: >-
      The level of your turntable when it is on but no record is playing. Leave it at -50 and
      Vinyl ID finds it by itself, about half a minute after it first hears the turntable with
      the needle up; the button at the bottom of the Vinyl ID page sets it at once. A number
      you type here is used as it is. A record starts once the sound is 12 dB above it.
  receiver_name:
    name: Listener name
    description: >-
      The name of the silent speaker Vinyl ID listens through, as shown in Music Assistant.
      It is not the player to look at.
  edit_from:
    name: Also allow edits from
    description: >-
      Normally the library can only be changed from the Vinyl ID page in Home Assistant.
      To let a script or another computer change it too, list their IP addresses here, separated by commas.
  max_library_mb:
    name: Library size limit (MB)
    description: >-
      Stop learning new songs once the library takes this much space. 0 means no limit.
      Covers and your edits are still saved, and songs already learned keep working.
      The Vinyl ID page shows the current size. Forgetting songs frees space again.
