<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vinyl ID</title>
  <meta name="theme-color" content="#0C0D11">
  <!-- every URL on this page is relative: it is served through Home Assistant's ingress -->
  <link rel="preload" href="ui/fonts/GoogleSans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="ui/style.css">
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="logo" id="logo" role="img" aria-label="Vinyl ID"></div>
    </header>

    <section id="now" class="card pad-l" aria-live="polite"></section>
    <section id="spin"></section>

    <section>
      <div class="section-head">
        <h2>Albums</h2>
        <button class="btn filled" id="add-album"><svg class="i s" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>Add album</button>
      </div>
      <div class="row" style="margin:16px 0">
        <label class="search"><svg class="i" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input id="q" type="search" placeholder="Search albums" aria-label="Search albums"></label>
      </div>
      <div id="albums" class="grid"></div>
      <p id="empty" class="muted" hidden>No albums yet. Add one, or just play a record and Vinyl ID will build the library.</p>
    </section>

    <section id="leftovers" hidden></section>

    <section class="card about" id="about">
      <div class="logo" id="logo2" role="img" aria-label="Vinyl ID"></div>
      <div id="sig"></div>
      <div class="ai" id="ai"></div>
      <div class="muted" id="size"></div>
      <div class="row" style="justify-content:center">
        <a class="btn tonal" href="https://ko-fi.com/goobis2dmx" target="_blank" rel="noopener"><svg class="i s" viewBox="0 0 24 24"><path d="M2 21h18v-2H2v2zM20 8h-2V5h2v3zm0-5H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2z"/></svg>Ko-fi</a>
        <a class="btn tonal" href="https://github.com/b2dmx/vinyl-id" target="_blank" rel="noopener"><svg class="i s" viewBox="0 0 24 24"><path d="M12 .5C5.73.5.75 5.48.75 11.75c0 4.96 3.21 9.16 7.67 10.65.56.1.77-.24.77-.54v-1.9c-3.12.68-3.78-1.5-3.78-1.5-.51-1.3-1.25-1.64-1.25-1.64-1.02-.7.08-.68.08-.68 1.13.08 1.72 1.16 1.72 1.16 1 1.72 2.63 1.22 3.27.93.1-.73.39-1.22.71-1.5-2.49-.28-5.11-1.25-5.11-5.55 0-1.23.44-2.23 1.16-3.02-.12-.28-.5-1.43.11-2.98 0 0 .94-.3 3.09 1.15a10.7 10.7 0 0 1 5.62 0c2.15-1.45 3.09-1.15 3.09-1.15.61 1.55.23 2.7.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.31-2.63 5.26-5.13 5.54.4.35.76 1.03.76 2.08v3.08c0 .3.2.65.78.54 4.46-1.49 7.66-5.69 7.66-10.65C23.25 5.48 18.27.5 12 .5z"/></svg>GitHub</a>
      </div>
    </section>
  </main>

  <dialog id="dlg" aria-modal="true"></dialog>
  <div id="toast" role="status"></div>
  <script src="ui/app.js"></script>
</body>
</html>
